<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shadow Swap</title>

    <!-- CSS yahan -->
    <link rel="stylesheet" href="output.css">
</head>

<body>

    <div class="game-container">

        <h1>🌑 SHADOW SWAP</h1>

        <div class="info">
            <span>Level: <b id="level">1</b></span>
            <span>Swaps: <b id="swaps">0</b></span>
        </div>

        <div id="gameBoard"></div>

        <div class="controls">
            <p>🎮 Move: Arrow Keys / WASD</p>
            <p>🌑 Swap: SPACE</p>
        </div>

        <div id="message"></div>

        <button id="restartBtn">Restart Game</button>

    </div>

    <!-- ⭐ JavaScript yahan laga hai -->
     <script src="game.js"></script>

</body>
</html>
