<!DOCTYPE html>
<html>
<head>
    <title>Always Visible</title>

    
</head>

<body>

    <div id="myBox">
        Ye box hamesha visible rahega.
        <input type="text" placeholder="ravi" minlength="2" required>
        <hr>
    </div>

    <script>
        const box = document.getElementById("myBox");

        // Agar JavaScript se hide karne ki koshish ho
        setInterval(() => {
            box.style.display = "block";
            box.style.visibility = "visible";
            box.style.opacity = "1";
        }, 100);
    </script>

</body>
</html>
