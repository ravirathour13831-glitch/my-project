 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RaviSocial</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">RaviSocial</div>

        <input type="text" id="search" placeholder="Search">

        <div class="nav-icons">
            <button>🏠</button>
            <button>👥</button>
            <button>🔔</button>
            <button>💬</button>
            <button>👤</button>
        </div>
    </header>

    <main class="container">

        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="profile">
                <div class="avatar">RK</div>
                <h3>Ravi Kumar</h3>
            </div>

            <div class="menu">
                <p>🏠 Home</p>
                <p>👥 Friends</p>
                <p>👤 Profile</p>
                <p>🔔 Notifications</p>
                <p>💬 Messages</p>
                <p>⚙️ Settings</p>
            </div>
        </aside>

        <!-- Feed -->
        <section class="feed">

            <!-- Create Post -->
            <div class="create-post">
                <div class="post-user">
                    <div class="avatar">RK</div>
                    <input type="text" id="postInput"
                        placeholder="What's on your mind, Ravi?">
                </div>

                <div class="post-buttons">
                    <button>📷 Photo</button>
                    <button>🎥 Video</button>
                    <button onclick="createPost()">➤ Post</button>
                </div>
            </div>

            <!-- Posts -->
            <div id="posts">

                <article class="post">
                    <div class="post-header">
                        <div class="avatar">RK</div>
                        <div>
                            <h3>Ravi Kumar</h3>
                            <small>Just now</small>
                        </div>
                    </div>

                    <p>Welcome to my social media website 🚀</p>

                    <div class="post-actions">
                        <button onclick="likePost(this)">❤️ Like <span>0</span></button>
                        <button>💬 Comment</button>
                        <button>↗️ Share</button>
                    </div>
                </article>

            </div>

        </section>

        <!-- Right Sidebar -->
        <aside class="right-sidebar">
            <h3>People You May Know</h3>

            <div class="friend">
                <div class="avatar">A</div>
                <span>Akash</span>
                <button>Add</button>
            </div>

            <div class="friend">
                <div class="avatar">H</div>
                <span>Hitesh</span>
                <button>Add</button>
            </div>

        </aside>

    </main>

    <script src="script.js"></script>

</body>
</html>
