
```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia 1280</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #222;
            font-family: monospace;
        }

        .phone {
            width: 300px;
            height: 560px;
            background: #111;
            border-radius: 25px;
            padding: 35px 20px;
            border: 5px solid #444;
        }

        .screen {
            width: 100%;
            height: 180px;
            background: #9aaa3a;
            border: 8px solid #333;
            padding: 12px;
            color: #172000;
            font-weight: bold;
            position: relative;
        }

        .status {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }

        .time {
            text-align: center;
            margin-top: 35px;
            font-size: 32px;
        }

        .date {
            text-align: center;
            margin-top: 8px;
            font-size: 14px;
        }

        .buttons {
            margin-top: 35px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        button {
            height: 48px;
            border-radius: 10px;
            border: 2px solid #555;
            background: #333;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:active {
            background: #666;
        }

        .menu {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            color: white;
        }
    </style>
</head>

<body>

    <div class="phone">

        <div class="screen">

            <div class="status">
                <span>▮▮▮</span>
                <span>🔋</span>
            </div>

            <div class="time" id="time">
                12:00
            </div>

            <div class="date">
                Nokia
            </div>

        </div>

        <div class="menu">
            <span>Menu</span>
            <span>Contacts</span>
        </div>

        <div class="buttons">
            <button>1</button>
            <button>2</button>
            <button>3</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>

            <button>*</button>
            <button>0</button>
            <button>#</button>
        </div>

    </div>

    <script>
        function updateTime() {

            let now = new Date();

            let hours = String(now.getHours()).padStart(2, "0");
            let minutes = String(now.getMinutes()).padStart(2, "0");

            document.getElementById("time").textContent =
                hours + ":" + minutes;
        }

        updateTime();

        setInterval(updateTime, 1000);
    </script>

</body>
</html>
