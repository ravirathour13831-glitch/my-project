<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Smart Kirana</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ================================================= -->
    <!-- LOGIN / REGISTER SCREEN -->
    <!-- ================================================= -->

    <div id="auth-screen">

        <div class="auth-box">

            <h1>🛒 Smart Kirana</h1>

            <p id="auth-title">
                Login to your account
            </p>


            <!-- ========================================= -->
            <!-- LOGIN BOX -->
            <!-- ========================================= -->

            <div id="login-box">

                <input
                    type="text"
                    id="login-username"
                    placeholder="Enter username"
                    autocomplete="username"
                >


                <!-- LOGIN PASSWORD -->

                <div class="password-box">

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        id="show-login-password"
                        class="eye-btn"
                    >
                        👁️
                    </button>

                </div>


                <button id="login-btn">
                    Login
                </button>


                <p id="login-message"></p>


                <button
                    type="button"
                    id="show-register-btn"
                    class="switch-btn"
                >
                    Create New Account
                </button>

            </div>


            <!-- ========================================= -->
            <!-- REGISTER BOX -->
            <!-- ========================================= -->

            <div
                id="register-box"
                class="hidden"
            >

                <input
                    type="text"
                    id="register-username"
                    placeholder="Create username"
                    autocomplete="username"
                >


                <!-- REGISTER PASSWORD -->

                <div class="password-box">

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Create password"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        id="show-register-password"
                        class="eye-btn"
                    >
                        👁️
                    </button>

                </div>


                <button id="register-btn">
                    Register
                </button>


                <p id="register-message"></p>


                <button
                    type="button"
                    id="show-login-btn"
                    class="switch-btn"
                >
                    Already have account? Login
                </button>

            </div>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- SMART KIRANA APP -->
    <!-- ================================================= -->

    <div id="shop-app">


        <!-- ========================================= -->
        <!-- HEADER -->
        <!-- ========================================= -->

        <header class="header">

            <h1>
                🛒 Smart Kirana
            </h1>

            <p>
                Smart Price Calculator & Billing App
            </p>

        </header>



        <main class="container">


            <!-- ========================================= -->
            <!-- SEARCH -->
            <!-- ========================================= -->

            <section class="search-section">

                <input
                    type="text"
                    id="search-input"
                    placeholder="Search: Apple / Seb / सेब / Aloo..."
                >

            </section>



            <!-- ========================================= -->
            <!-- CATEGORY -->
            <!-- ========================================= -->

            <section class="section">

                <h2>
                    Categories
                </h2>

                <div id="categories"></div>

            </section>



            <!-- ========================================= -->
            <!-- PRODUCTS -->
            <!-- ========================================= -->

            <section class="section">

                <div class="section-header">

                    <h2>
                        Products
                    </h2>

                    <button id="add-product-btn">
                        + Add Product
                    </button>

                </div>


                <div id="product-list"></div>

            </section>



            <!-- ========================================= -->
            <!-- CART -->
            <!-- ========================================= -->

            <section class="cart-section">

                <h2>
                    🛒 Selected Items
                </h2>


                <div id="cart-list">

                    <p class="empty-cart">
                        अभी कोई item select नहीं किया।
                    </p>

                </div>



                <!-- BILL -->

                <div class="bill-box">


                    <!-- SUBTOTAL -->

                    <div class="bill-row">

                        <span>
                            Subtotal
                        </span>

                        <strong>
                            ₹<span id="subtotal">0.00</span>
                        </strong>

                    </div>



                    <!-- DISCOUNT -->

                    <div class="discount-row">

                        <label>
                            Discount %
                        </label>

                        <input
                            type="number"
                            id="discount"
                            value="0"
                            min="0"
                            max="100"
                        >

                    </div>



                    <!-- DISCOUNT AMOUNT -->

                    <div class="bill-row">

                        <span>
                            Discount
                        </span>

                        <strong>
                            ₹<span id="discount-amount">0.00</span>
                        </strong>

                    </div>



                    <!-- GRAND TOTAL -->

                    <div class="grand-total">

                        <span>
                            Total
                        </span>

                        <strong>
                            ₹<span id="grand-total">0.00</span>
                        </strong>

                    </div>



                    <!-- CLEAR BILL -->

                    <button
                        id="clear-cart"
                        class="danger-btn"
                    >
                        Clear Bill
                    </button>

                </div>

            </section>

        </main>



        <!-- ================================================= -->
        <!-- CALCULATOR MODAL -->
        <!-- ================================================= -->

        <div
            id="calculator-modal"
            class="modal hidden"
        >

            <div class="modal-content">


                <!-- CLOSE -->

                <button
                    id="calculator-close"
                    class="close-btn"
                >
                    ✕
                </button>



                <!-- PRODUCT NAME -->

                <h2 id="calculator-product-name">
                    Product
                </h2>



                <!-- PRODUCT PRICE -->

                <p
                    id="calculator-product-price"
                    class="modal-price"
                >
                </p>



                <!-- ========================================= -->
                <!-- CURRENT PRICE -->
                <!-- ========================================= -->

                <label>
                    Current Price
                </label>

                <input
                    type="number"
                    id="current-price"
                    min="0"
                    step="0.01"
                >



                <!-- ========================================= -->
                <!-- KG / LITRE -->
                <!-- ========================================= -->

                <div id="weight-calculator">


                    <!-- MODE BUTTONS -->

                    <div class="choice-buttons">


                        <!-- MONEY MODE -->

                        <button
                            id="money-mode"
                            class="mode-btn active"
                        >
                            💰 पैसे के हिसाब से
                        </button>



                        <!-- QUANTITY MODE -->

                        <button
                            id="quantity-mode"
                            class="mode-btn"
                        >
                            ⚖️ मात्रा के हिसाब से
                        </button>

                    </div>



                    <!-- ================================= -->
                    <!-- MONEY -->
                    <!-- ================================= -->

                    <div id="money-box">

                        <label>
                            Customer कितने रुपये का लेना चाहता है?
                        </label>


                        <input
                            type="number"
                            id="money-input"
                            placeholder="जैसे 25"
                            min="0"
                            step="0.01"
                        >


                        <div class="result-box">

                            मिलेगा:

                            <strong id="money-result">
                                0
                            </strong>

                        </div>

                    </div>



                    <!-- ================================= -->
                    <!-- QUANTITY -->
                    <!-- ================================= -->

                    <div
                        id="quantity-box"
                        class="hidden"
                    >

                        <label>
                            Customer कितना लेना चाहता है?
                        </label>


                        <input
                            type="number"
                            id="quantity-input"
                            placeholder="जैसे 500"
                            min="0"
                            step="0.01"
                        >


                        <select id="quantity-unit">

                            <option value="small">
                                Gram
                            </option>

                            <option value="base">
                                Kg
                            </option>

                        </select>


                        <div class="result-box">

                            कीमत:

                            ₹<strong id="quantity-result">
                                0
                            </strong>

                        </div>

                    </div>

                </div>



                <!-- ========================================= -->
                <!-- PIECE / PACKET -->
                <!-- ========================================= -->

                <div
                    id="count-calculator"
                    class="hidden"
                >

                    <label>

                        कितने

                        <span id="count-unit-name">
                            Piece
                        </span>

                        ?

                    </label>



                    <div class="counter">


                        <button id="minus-count">
                            −
                        </button>


                        <span id="count-value">
                            1
                        </span>


                        <button id="plus-count">
                            +
                        </button>

                    </div>



                    <div class="piece-total">

                        Total:

                        ₹<span id="count-result">
                            0
                        </span>

                    </div>

                </div>



                <!-- ADD TO BILL -->

                <button
                    id="add-to-bill"
                    class="add-bill-btn"
                >
                    🛒 Add To Bill
                </button>

            </div>

        </div>



        <!-- ================================================= -->
        <!-- ADD PRODUCT MODAL -->
        <!-- ================================================= -->

        <div
            id="product-modal"
            class="modal hidden"
        >

            <div class="modal-content">


                <!-- CLOSE -->

                <button
                    id="close-modal"
                    class="close-btn"
                >
                    ✕
                </button>



                <h2>
                    Add New Product
                </h2>



                <!-- PRODUCT NAME ENGLISH -->

                <label>
                    Product Name English
                </label>

                <input
                    type="text"
                    id="new-name-en"
                    placeholder="Example: Sugar"
                >



                <!-- PRODUCT NAME HINDI -->

                <label>
                    Product Name Hindi
                </label>

                <input
                    type="text"
                    id="new-name-hi"
                    placeholder="Example: चीनी"
                >



                <!-- SEARCH NAMES -->

                <label>
                    Search Names
                </label>

                <input
                    type="text"
                    id="new-aliases"
                    placeholder="sugar, chini, चीनी"
                >



                <!-- CATEGORY -->

                <label>
                    Category
                </label>

                <select id="new-category">

                    <option value="grocery">
                        🥫 Grocery
                    </option>

                    <option value="pulses">
                        🌾 Pulses
                    </option>

                    <option value="vegetables">
                        🥬 Vegetables
                    </option>

                    <option value="fruits">
                        🍎 Fruits
                    </option>

                    <option value="snacks">
                        🍪 Namkeen / Snacks
                    </option>

                    <option value="daily">
                        🧴 Daily Use
                    </option>

                    <option value="home">
                        🏠 Home Use
                    </option>

                </select>



                <!-- UNIT -->

                <label>
                    Unit
                </label>

                <select id="new-unit">

                    <option value="kg">
                        Kg
                    </option>

                    <option value="litre">
                        Litre
                    </option>

                    <option value="piece">
                        Piece
                    </option>

                    <option value="packet">
                        Packet
                    </option>

                </select>



                <!-- PRICE -->

                <label>
                    Price
                </label>

                <input
                    type="number"
                    id="new-price"
                    placeholder="Example: 50"
                    min="0"
                    step="0.01"
                >



                <!-- MODAL BUTTONS -->

                <div class="modal-buttons">


                    <button
                        id="save-product"
                        class="save-btn"
                    >
                        Save Product
                    </button>


                    <button
                        id="cancel-product"
                        class="cancel-btn"
                    >
                        Cancel
                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- ================================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================================= -->

    <script src="script.js"></script>


</body>

</html>
