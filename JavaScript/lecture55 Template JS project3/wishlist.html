<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Wishlist</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Your CSS -->
    <link rel="stylesheet"
          href="css/style.css">

    <!-- Main JS -->
    <script src="js/main.js" defer></script>

</head>


<body class="min-h-screen bg-slate-50 text-slate-800">


    <!-- ================= HEADER ================= -->

    <header
        class="bg-white border-b border-slate-200
               sticky top-0 z-50"
    >

        <div
            class="max-w-6xl mx-auto px-4 h-16
                   flex items-center justify-between"
        >

            <!-- LOGO -->

            <a
                href="index.html"
                class="flex items-center gap-2
                       text-xl font-bold text-slate-900"
            >

                <span class="text-2xl">
                    🛍️
                </span>

                <span>
                    My Store
                </span>

            </a>


            <!-- NAV -->

            <nav
                class="flex items-center
                       gap-3 sm:gap-6"
            >

                <!-- HOME -->

                <a
                    href="index.html"
                    class="text-sm font-medium
                           text-slate-600
                           hover:text-teal-700"
                >
                    Home
                </a>


                <!-- WISHLIST -->

                <a
                    href="wishlist.html"
                    class="flex items-center gap-1
                           text-sm font-semibold
                           text-teal-700"
                >

                    ❤️ Wishlist

                    <span
                        id="wishlist-count"
                        class="min-w-5 h-5 px-1
                               flex items-center justify-center
                               text-xs text-white
                               bg-teal-700
                               rounded-full"
                    >
                        0
                    </span>

                </a>


                <!-- CART -->

                <a
                    href="cart.html"
                    class="flex items-center gap-1
                           text-sm font-medium
                           text-slate-600
                           hover:text-teal-700"
                >

                    🛒 Cart

                    <span
                        id="cart-count"
                        class="min-w-5 h-5 px-1
                               flex items-center justify-center
                               text-xs text-white
                               bg-teal-700
                               rounded-full"
                    >
                        0
                    </span>

                </a>

            </nav>

        </div>

    </header>



    <!-- ================= MAIN ================= -->

    <main
        class="max-w-6xl mx-auto px-4 py-8"
    >


        <!-- PAGE TITLE -->

        <div class="mb-8">

            <p
                class="text-sm font-medium
                       text-teal-700"
            >
                Your saved products
            </p>


            <h1
                class="text-3xl sm:text-4xl
                       font-bold
                       text-slate-900
                       mt-1"
            >
                ❤️ My Wishlist
            </h1>


            <p
                class="text-slate-500 mt-2"
            >
                Products you love,
                saved in one place.
            </p>

        </div>



        <!-- ================= WISHLIST ================= -->

        <!--

            JavaScript yahan wishlist
            ke products render karega.

        -->

        <div id="wishlist-container">

        </div>


    </main>



    <!-- ================= FOOTER ================= -->

    <footer
        class="bg-white border-t
               border-slate-200
               mt-10"
    >

        <div
            class="max-w-6xl mx-auto
                   px-4 py-6
                   text-center
                   text-sm text-slate-500"
        >

            © 2026 My Store.
            All rights reserved.

        </div>

    </footer>


</body>

</html>
